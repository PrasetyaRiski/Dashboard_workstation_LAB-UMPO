# ==============================================================================
# NGINX REVERSE PROXY: DOMAIN LOKAL LAB AI UMPO
# Melayani Dashboard (:8888) dan JupyterHub (:8090) di Port 80 (HTTP Standar)
# Tanpa perlu ketik port, tanpa domain publik, tanpa Cloudflare!
# ==============================================================================

# Mapping untuk koneksi WebSocket stabil (Jupyter Terminal/Kernel & Dashboard Telemetry)
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ------------------------------------------------------------------------------
# 1. JUPYTERHUB (http://jupyter.labai.local & http://jupyter.ai.lab.umpo)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name jupyter.labai.local jupyter.ai.lab.umpo jupyter.labai.umpo jupyter.local;

    # Batas ukuran upload dataset/file mahasiswa (2 GB)
    client_max_body_size 2048M;

    location / {
        proxy_pass http://127.0.0.1:8090;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Support (Wajib untuk Jupyter Notebook Kernel & Terminal)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeout panjang agar notebook tidak putus saat kalkulasi lama
        proxy_connect_timeout 600s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;

        # Disable buffering agar streaming output cell notebook instan
        proxy_buffering off;
    }
}

# ------------------------------------------------------------------------------
# 2. DASHBOARD MONITORING (http://labai.local & http://ai.lab.umpo & Default IP)
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name labai.local dashboard.labai.local ai.lab.umpo labai.umpo 76.76.76.188 localhost;

    client_max_body_size 100M;

    # Navigasi cepat: jika user membuka http://labai.local/jupyter atau /hub
    location ~* ^/(jupyter|hub) {
        return 302 http://jupyter.labai.local$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8888;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Support (Untuk Real-time Telemetry Dashboard)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;

        # Disable buffering agar streaming metrik lancar
        proxy_buffering off;
    }
}
